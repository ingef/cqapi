[tool.poetry]
name = "cqapi"
version = "0.6.9"
description = "A Conquery REST API library."
authors = ["InGef - EVA Team <eva@ingef.de>"]
readme = "README.md"
packages = [{ include = "cqapi"}]

[tool.poetry.dependencies]
python = "^3.13"
attrs = "^25.3"
ipython = "^9.3"
pandas = "^2.3"
numpy = "2.2.6"
pyarrow = "^20.0.0"
charset-normalizer = "^3.4.5"
requests = "^2.32"
tabulate = "^0.9"
typeguard = "^4.4"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
