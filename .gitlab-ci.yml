stages:
  - testing
  - publish


testing:
  stage: testing
  image: ocireg.spectrumk.de/hub.docker.com/library/python:3.13.5-bullseye
  interruptible: true
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  before_script:
      - pip install poetry
      - poetry install --with test
  script:
      - pytest tests


publish:
  stage: publish
  image: ocireg.spectrumk.de/hub.docker.com/library/python:3.13.5-bullseye
  rules:
    - if: '$CI_COMMIT_TAG != null && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - pip install poetry
  script:
    - poetry config repositories.cqapi-repo "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
    - poetry config http-basic.cqapi-repo gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry config certificates.cqapi-repo.cert false
    - poetry publish --build --repository cqapi-repo --no-interaction
